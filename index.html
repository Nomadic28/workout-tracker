<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Workout Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#111;--bg2:#1a1a1a;--bg3:#222;--bg4:#2a2a2a;--txt:#fff;--txt2:#ccc;--txt3:#888;--green:#2d9e6b;--green2:#1a6b46;--green-bg:#0d3322;--red:#c0392b;--border:#2a2a2a;--accent:#2d9e6b;--amber:#c47f1a;--amber-bg:#2a1f0a}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;background:var(--bg)}
.hdr{padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0;padding-top:max(14px,env(safe-area-inset-top))}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.wklbl{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.wklbl span{color:var(--txt2);font-weight:400}
.hdrsub{font-size:12px;color:var(--txt2)}
.dbtn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--txt);padding:7px 11px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:44px}
.dbtn svg{width:14px;height:14px;stroke:var(--txt2);fill:none;stroke-width:2}
.sync-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--red)}.sync-dot.ing{background:var(--amber);animation:pulse 1s infinite}.sync-dot.off{background:var(--txt3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 13px;font-size:12px;color:var(--txt2);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;flex-shrink:0;min-height:44px;display:flex;align-items:center}
.tab.active{color:var(--txt);border-bottom-color:var(--accent)}
.content{padding:12px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.mbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:5px;margin-bottom:8px;letter-spacing:0.4px;text-transform:uppercase}
.mbadge.Chest{background:#8f3d3d;color:#ffc5c5}.mbadge.Back{background:#3d5a8f;color:#c5d5ff}
.mbadge.Shoulders{background:#3d8f6c;color:#c5ffe8}.mbadge.Biceps{background:#8f6c3d;color:#ffe8c5}
.mbadge.Triceps{background:#5a3d8f;color:#d5c5ff}.mbadge.Quads{background:#8f7a3d;color:#fff0c5}
.mbadge.Hamstrings{background:#3d8f8f;color:#c5ffff}.mbadge.Glutes{background:#8f3d6c;color:#ffc5e8}
.mbadge.Calves{background:#4a8f3d;color:#c5ffc0}.mbadge.Core{background:#555;color:#ddd}
.mbadge.Forearms{background:#6b4c2a;color:#ffe0b2}
.bars{display:flex;gap:2px;margin-right:2px}
.bar{width:3px;height:10px;border-radius:1px;background:currentColor;opacity:0.7}
.exc{background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:10px}
.exc.done{border:1px solid var(--green2)}
.exn{font-size:15px;font-weight:600;margin-bottom:2px}
.exs{font-size:12px;color:var(--txt)}
.nbtn{background:transparent;border:none;color:var(--txt3);font-size:11px;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;margin:5px 0 7px;min-height:32px}
.nbtn:hover{color:var(--txt2)}
.ntxt{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--txt2);font-size:13px;padding:8px 10px;outline:none;resize:none;font-family:inherit;margin-top:4px;line-height:1.4}
.ntxt:focus{border-color:var(--txt3)}
.nshow{font-size:11px;color:var(--txt3);font-style:italic;margin:3px 0 7px}
.sh{display:grid;grid-template-columns:20px 1fr 1fr 32px 26px;gap:5px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:4px;padding:0 2px}
.sr{display:grid;grid-template-columns:20px 1fr 1fr 32px 26px;gap:5px;align-items:center;padding:6px 2px;border-top:1px solid var(--border)}
.sn{font-size:11px;color:var(--txt3)}
.si{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--txt);font-size:14px;font-weight:500;text-align:center;padding:7px 2px;width:100%;outline:none;min-height:40px}
.si:focus{border-color:var(--accent)}.si:disabled{opacity:0.45}
.lc{width:32px;height:32px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;background:transparent;flex-shrink:0}
.lc.on{border-color:var(--accent)}.lc.on svg{stroke:var(--accent)}
.lc svg{width:14px;height:14px;stroke:transparent;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ds{width:26px;height:26px;border:none;background:transparent;color:var(--txt3);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;flex-shrink:0}
.ds:active{color:var(--red);background:rgba(192,57,43,0.12)}
.adds{width:100%;background:transparent;border:1px dashed var(--border);border-radius:7px;color:var(--txt3);font-size:12px;padding:8px;cursor:pointer;margin-top:6px;min-height:40px}
.addex{width:100%;background:var(--green-bg);border:1px dashed var(--green2);border-radius:10px;color:var(--green);font-size:13px;font-weight:500;padding:13px;cursor:pointer;margin-top:4px;margin-bottom:4px;min-height:48px}
.clsbtn{width:100%;border:none;border-radius:10px;font-size:14px;font-weight:600;padding:15px;cursor:pointer;margin-top:6px;margin-bottom:4px;min-height:52px}
.clsbtn.rdy{background:var(--green);color:#fff}
.clsbtn.no{background:var(--bg3);color:var(--txt3);border:1px solid var(--border)}
.delbtn{width:100%;border:1px solid var(--red);border-radius:10px;font-size:12px;font-weight:500;padding:12px;cursor:pointer;margin-top:4px;background:transparent;color:var(--red);min-height:46px}
.bnr{border-radius:9px;padding:11px 14px;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.bnr.g{background:var(--green-bg);border:1px solid var(--green2)}
.bnr.a{background:var(--amber-bg);border:1px solid var(--amber)}
.bnr svg{width:18px;height:18px;fill:none;stroke-width:2;flex-shrink:0}
.bnr.g svg{stroke:var(--green)}.bnr.a svg{stroke:var(--amber)}
.mcard{background:var(--bg2);border-radius:10px;padding:13px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;min-height:44px}
.mcard.am{border-color:var(--accent)}
.mtitle{font-size:14px;font-weight:600;margin-bottom:3px}
.mmeta{font-size:11px;color:var(--txt2);display:flex;gap:10px;flex-wrap:wrap}
.mtag{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:600}
.mtag.active{background:var(--green-bg);color:var(--green);border:1px solid var(--green2)}
.mtag.done{background:var(--bg3);color:var(--txt3)}
.wdots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.wd{width:22px;height:22px;border-radius:50%;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wd.dw{background:var(--green);color:#fff}.wd.cw{background:var(--accent);color:#fff}.wd.fw{background:var(--bg3);color:var(--txt3)}.wd.dlw{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber)}
.nmbtn{width:100%;background:var(--green-bg);border:1px dashed var(--green2);border-radius:10px;color:var(--green);font-size:13px;font-weight:600;padding:13px;cursor:pointer;margin-bottom:12px;min-height:52px}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:flex-end;z-index:100}
.mp{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;padding:18px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.mtt{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.mcb{background:var(--bg3);border:none;color:var(--txt2);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.mi{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-size:14px;padding:10px 12px;margin-bottom:8px;outline:none;font-family:inherit;min-height:44px}
.mi:focus{border-color:var(--accent)}
.ml{font-size:11px;color:var(--txt2);margin-bottom:4px;margin-top:7px}
.dtoggles{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.dtt{padding:8px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--txt2);font-size:13px;cursor:pointer;font-weight:500;min-height:40px}
.dtt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mbtn{width:100%;border:none;border-radius:9px;font-size:13px;font-weight:600;padding:14px;cursor:pointer;margin-top:6px;min-height:50px}
.mbtn.g{background:var(--green);color:#fff}.mbtn.gh{background:var(--bg3);color:var(--txt2);border:1px solid var(--border)}.mbtn.rd{background:transparent;color:var(--red);border:1px solid var(--red)}
.expick{padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--txt);display:flex;align-items:center;gap:8px;min-height:48px}
.expick:active{color:var(--accent)}
.stit{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.4px;padding:8px 0 4px;font-weight:600}
.dtabrow{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.dtabrow::-webkit-scrollbar{display:none}
.dtab{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;min-height:38px}
.dtab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.texrow{background:var(--bg3);border-radius:8px;padding:10px 11px;margin-bottom:6px}
.texhdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.texn{font-size:13px;font-weight:600}.texm{font-size:11px;color:var(--txt2)}
.texsh{display:grid;grid-template-columns:20px 1fr 1fr 24px;gap:5px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:3px}
.texsr{display:grid;grid-template-columns:20px 1fr 1fr 24px;gap:5px;align-items:center;margin-top:4px}
.texi{background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--txt);font-size:13px;text-align:center;padding:6px 2px;width:100%;outline:none;min-height:38px}
.texi:focus{border-color:var(--accent)}
.texadd{background:transparent;border:1px dashed var(--border);border-radius:5px;color:var(--txt3);font-size:11px;padding:6px;cursor:pointer;width:100%;margin-top:4px;min-height:36px}
.copyday{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.cdybtn{padding:7px 12px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--txt2);font-size:12px;cursor:pointer;min-height:38px}
.cdybtn:active{border-color:var(--accent);color:var(--accent)}
.hcard{background:var(--bg2);border-radius:10px;padding:12px;margin-bottom:9px;cursor:pointer;border:1px solid var(--border)}
.hcard.cl{border-color:var(--green2)}
.hdate{font-size:13px;font-weight:600;margin-bottom:3px}
.hpills{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.hp{font-size:10px;padding:3px 8px;border-radius:12px;background:var(--bg4);color:var(--txt2)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{background:var(--bg2);border-radius:10px;padding:12px}
.sv{font-size:22px;font-weight:700}
.sl{font-size:10px;color:var(--txt2);margin-top:2px;text-transform:uppercase;letter-spacing:0.4px}
.cpbtn{width:100%;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:600;padding:12px;cursor:pointer;margin-top:8px;min-height:48px}
.pasta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--txt);font-size:11px;padding:10px;font-family:monospace;resize:vertical;min-height:80px;outline:none;margin-top:6px}
.stitle{font-size:12px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:0.4px;margin-bottom:9px;margin-top:4px}
.rtag{font-size:10px;background:var(--bg4);color:var(--txt2);padding:2px 6px;border-radius:4px}
.nav{display:flex;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 3px;background:transparent;border:none;color:var(--txt3);font-size:10px;cursor:pointer;min-height:54px}
.nb.active{color:var(--accent)}
.nb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1}
</style>
</head>
<body>
<div id="app">
<div class="hdr">
  <div class="hdr-top">

</div>
<div id="mo" class="mo" style="display:none" onclick="cmo(event)">

<script>
// ── Supabase config ───────────────────────────────────────────
const SB_URL='https://kualqedxvdevbvapzgyu.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt1YWxxZWR4dmRldmJ2YXB6Z3l1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NjIyNDksImV4cCI6MjA5MzMzODI0OX0.rHNlqoY2nGiGgt3bXJRs3LiNZcrMaKRV3NvVzeYSemg';
const SB_HEADERS={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
let syncTimer=null;
let lastSyncedHash='';
function setSyncStatus(status,label){
  const dot=document.getElementById('sync-dot');
  const lbl=document.getElementById('sync-lbl');
  if(!dot||!lbl)return;
  dot.className='sync-dot '+status;
  lbl.textContent=label;
}
function dataHash(){return JSON.stringify(S).length+'_'+S.mesocycles.length+'_'+Object.keys(S.workouts).length;}
async function syncToSupabase(){
  setSyncStatus('ing','Saving...');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/workout_data?id=eq.singleton`,{
      method:'PATCH',
      headers:{...SB_HEADERS,'Prefer':'return=minimal'},
      body:JSON.stringify({data:S,updated_at:new Date().toISOString()})
    });
    if(res.ok){lastSyncedHash=dataHash();setSyncStatus('ok','Saved');setTimeout(()=>setSyncStatus('ok','Synced'),2000);}
    else setSyncStatus('err','Save failed');
  }catch(e){setSyncStatus('err','Offline');}
}
async function loadFromSupabase(){
  setSyncStatus('ing','Loading...');
  try{
    const res=await fetch(`${SB_URL}/rest/v1/workout_data?id=eq.singleton&select=data`,{headers:SB_HEADERS});
    if(res.ok){
      const rows=await res.json();
      if(rows&&rows[0]&&rows[0].data&&Object.keys(rows[0].data).length>0){
        const remote=rows[0].data;
        if(remote.mesocycles)S.mesocycles=remote.mesocycles;
        if(remote.workouts)S.workouts=remote.workouts;
        if(remote.customExercises)S.customExercises=remote.customExercises;
        saveLocal();lastSyncedHash=dataHash();setSyncStatus('ok','Synced');renderAll();
      }else{setSyncStatus('ok','Synced');scheduleSave();}
    }else setSyncStatus('err','Load failed');
  }catch(e){setSyncStatus('err','Offline');}
}
function scheduleSave(){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>{if(dataHash()!==lastSyncedHash)syncToSupabase();},1500);
}
// ── Data ──────────────────────────────────────────────────────
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const BL={Chest:['Flat Barbell Press','Incline Dumbbell Press','Cable Fly','Dip','Incline Chest Press','Decline Chest Press','Dumbbell Press (Flat)','Dumbbell Press (Medium Incline)','Seated Chest Press','Machine Flye','Cable Flye (High)','Cable Flye (Underhand)','Hammer Machine Chest Press (Flat)','Hammer Machine Chest Press (Incline)','Lying Chest Press Machine','Dumbbell Press Flye (Flat)','Smith Machine Press (Incline)','Seated Flys','Dumbbell Decline Chest Press','Decline Decline Chest Press','Smith Machine Press (Medium Incline, Narrow Grip)','Standing Chest Press'],Back:['Deadlift','Barbell Row','Pull-Up','Lat Pulldown','Seated Cable Row','Back Attack','Hammer Machine Row (High)','Hammer Machine Row (Low)','Machine Pulldown','Machine Pullover','Machine Reverse Flye','Pulldown (Wide Grip)','Pulldown (Normal Grip)','Pulldown (Narrow Grip)','Pull Up Band','Reverse Hyper Extension','Seated Cable Row (Single-Arm)','High Machine Pulldown Upstairs','T-Bar Row','Watson Dual Stack Pulldown','V Bar Pulldown'],Shoulders:['Overhead Press','Dumbbell Lateral Raise','Face Pull','Freemotion Y-Raises (Paused)','Freemotion Rear Delt Flyes','Machine Lateral Raise','Machine Shoulder Press','Cable Lateral Raise (Single-Arm)','Cable Front Raise (Overhand)','Cable Rope Facepull','Cable Raise Facing Away','Cable Raise Facing Towards','Dumbbell Front Raise','Dumbbell Shrug','Dumbbell Lateral Raise (Super ROM)','Plate Loaded Lat Raises','Seated Rear Delt Shoulder','Bar EZ Bar Underhand 7.5kg Bar','Smith Machine Upright Row'],Biceps:['Barbell Curl','Incline Dumbbell Curl','Cable Curl','Bayesian Curl','Bicep Curl Close Hands','Bicep Curl Palms Down','EZ Bar Curl (Narrow Grip)','Lying Biceps Dumbbell Curl','Machine Preacher Curl','Standing Tricep Extension'],Triceps:['Close Grip Bench Press','Tricep Pushdown','Barbell Skullcrusher','Cable Triceps Pushdown (Bar)','Machine Triceps Extension','Seated Dip Machine','Seated Triceps Pushdown','V Bar Pushdown','Cable Overhead Triceps Extension'],Quads:['Squat','Leg Press','Hack Squat','Leg Extension','Hip Adduction'],Hamstrings:['Romanian Deadlift','Lying Leg Curl','Seated Leg Curl','Back Raise (45 degree)','Bench Press Leg Lift'],Glutes:['Hip Thrust','Hip Abduction Machine','Reverse Glute Pendulum Machine'],Calves:['Smith Machine Calves','Calf Machine'],Abs:['Cable Twist','Machine Crunch','Crunch Machine Upstairs','Bench Press Leg Lift'],Forearms:['Bent Over Grip Strength','Dumbbell Bench Wrist Curl']};
let S={mesocycles:[],workouts:{},customExercises:{},currentDate:'',activeTab:'workout'};
const tds=d=>d.toISOString().split('T')[0];
const tod=()=>tds(new Date());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=s=>pd(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtS=s=>pd(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const fmtSY=s=>pd(s).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
function saveLocal(){try{localStorage.setItem('wt_v7',JSON.stringify(S))}catch(e){}}
function save(){saveLocal();scheduleSave();}
function loadLocal(){try{const r=localStorage.getItem('wt_v7');if(r)Object.assign(S,JSON.parse(r));}catch(e){}}
function getLib(){
  const lib={};
  Object.entries(BL).forEach(([m,e])=>{lib[m]=[...e]});
  Object.entries(S.customExercises||{}).forEach(([m,e])=>{
    if(!lib[m])lib[m]=[];
    e.forEach(x=>{if(!lib[m].includes(x))lib[m].push(x)});
  });
  return lib;
}
function activeMeso(){return S.mesocycles.find(m=>m.status==='active')||null;}
function getMesoDates(meso){
  const dates=[];
  const start=pd(meso.startDate);
  const startDow=(start.getDay()+6)%7;
  const totalWeeks=meso.weeks+(meso.deload?1:0);
  for(let w=0;w<totalWeeks;w++){
    for(const di of(meso.trainDays||[])){
      let off=di-startDow;if(off<0)off+=7;
      const d=new Date(start);d.setDate(start.getDate()+w*7+off);
      dates.push(tds(d));
    }
  }
  return[...new Set(dates)].sort();
}
function getMesoWD(meso,ds){
  const dates=getMesoDates(meso);
  const idx=dates.indexOf(ds);if(idx<0)return null;
  const n=meso.trainDays.length;
  return{week:Math.floor(idx/n)+1,day:idx%n+1,totalWeeks:meso.weeks+(meso.deload?1:0),isDeload:meso.deload&&Math.floor(idx/n)+1===meso.weeks+(meso.deload?1:0),dayIndex:idx%n};
}
function mesoForDate(ds){
  for(const m of S.mesocycles){
    if(m.status!=='active'&&m.status!=='done')continue;
    if(getMesoDates(m).includes(ds))return m;
  }
  return null;
}
function getW(ds){
  if(!S.workouts[ds])S.workouts[ds]={exercises:[],closed:false};
  if(Array.isArray(S.workouts[ds]))S.workouts[ds]={exercises:S.workouts[ds],closed:false};
  return S.workouts[ds];
}
function allLogged(ds){
  const w=getW(ds);
  if(!(w.exercises||[]).length)return false;
  return w.exercises.every(ex=>ex.sets.every(s=>s.logged));
}

// ── FIX 1: Rep progression — find the correct next-week date from the meso schedule ──
// Old code used dnwa(ds,1) = ds + 7 days, which is wrong for multi-day weeks.
// New code finds this date's index in the meso schedule, then picks the same
// day-of-week slot in the following week.
function getNextWeekDate(meso, ds) {
  const dates = getMesoDates(meso);
  const idx = dates.indexOf(ds);
  if (idx < 0) return null;
  const n = meso.trainDays.length;
  const daySlot = idx % n;          // which day within the week (0=Mon slot, 1=Tue slot…)
  const currentWeek = Math.floor(idx / n);
  const nextWeekIdx = (currentWeek + 1) * n + daySlot;
  return nextWeekIdx < dates.length ? dates[nextWeekIdx] : null;
}

function closeDay(ds){
  const w=getW(ds);if(!allLogged(ds))return;
  w.closed=true;
  const meso=mesoForDate(ds);
  if(meso){
    const dates=getMesoDates(meso);
    if(ds===dates[dates.length-1]){meso.status='done';}
    else{
      // FIX: use meso-aware next-week date instead of flat +7 days
      const nd = getNextWeekDate(meso, ds);
      if(nd){
        const nw=getW(nd);
        if(!(nw.exercises||[]).length){
          nw.exercises=w.exercises.map(ex=>({
            muscle:ex.muscle,
            name:ex.name,
            note:ex.note||'',
            // FIX: use the actual logged reps as base, then +1
            sets:ex.sets.map(s=>({
              weight:s.weight,
              reps:s.reps?(parseInt(s.reps)+1).toString():'',
              logged:false
            }))
          }));
          nw.closed=false;nw.fromPrev=true;
        }
      }
    }
  }
  save();renderAll();
}
function jumpToNextDay(ds){
  const meso=mesoForDate(ds);
  if(!meso)return;
  const dates=getMesoDates(meso);
  const idx=dates.indexOf(ds);
  if(idx>=0&&idx<dates.length-1){
    S.currentDate=dates[idx+1];
    renderAll();
  }
}
function showExHistory(ei){
  const exName=getW(S.currentDate).exercises[ei]?.name;
  if(!exName)return;
  const entries=[];
  Object.keys(S.workouts).sort().forEach(function(d){
    const w=S.workouts[d];
    if(!w||!w.closed)return;
    const ex=(w.exercises||[]).find(function(e){return e.name===exName;});
    if(!ex)return;
    const meso=mesoForDate(d);
    const wd=meso?getMesoWD(meso,d):null;
    entries.push({date:d,meso:meso?meso.name:'',wd,sets:ex.sets});
  });
  if(!entries.length){
    showM('<div class="mtt">No history<button class="mcb" onclick="closeM()">x</button></div><div style="font-size:13px;color:var(--txt2);padding:8px 0">No logged sessions found for <b>'+exName+'</b>.</div><button class="mbtn gh" onclick="closeM()">Close</button>');
    return;
  }
  const byMeso={};
  entries.forEach(function(e){
    const key=e.meso||'Unknown';
    if(!byMeso[key])byMeso[key]=[];
    byMeso[key].push(e);
  });
  let h='<div class="mtt">'+exName+'<button class="mcb" onclick="closeM()">x</button></div>';
  h+='<div style="max-height:60vh;overflow-y:auto;margin:0 -16px;padding:0 16px">';
  Object.keys(byMeso).reverse().forEach(function(mName){
    h+='<div style="font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;margin:12px 0 6px">'+mName+'</div>';
    byMeso[mName].slice().reverse().forEach(function(e){
      const wdLabel=e.wd?'W'+e.wd.week+' D'+e.wd.day+' - ':'';
      const setsStr=e.sets.map(function(s){return s.weight+'kg x '+s.reps;}).join(', ');
      h+='<div style="padding:8px 0;border-bottom:1px solid var(--bg3)">';
      h+='<div style="font-size:13px;font-weight:600;color:var(--txt1)">'+setsStr+'</div>';
      h+='<div style="font-size:11px;color:var(--txt3);margin-top:2px">'+wdLabel+fmtS(e.date)+'</div>';
      h+='</div>';
    });
  });
  h+='</div><button class="mbtn gh" style="margin-top:12px" onclick="closeM()">Close</button>';
  showM(h);
}
function deleteDate(ds){
  delete S.workouts[ds];
  const meso=mesoForDate(ds);
  if(meso)preloadDay(meso,ds);
  save();renderAll();
}
function preloadDay(meso,ds){
  const dates=getMesoDates(meso);
  const idx=dates.indexOf(ds);if(idx<0)return;
  const di=idx%meso.trainDays.length;
  const tpl=meso.days[di];
  const w=getW(ds);
  if(!(w.exercises||[]).length&&!w.closed){
    w.exercises=tpl.exercises.map(ex=>({muscle:ex.muscle,name:ex.name,note:ex.note||'',sets:ex.sets.map(s=>({weight:s.weight,reps:s.reps,logged:false}))}));
    save();
  }
}
function renderAll(){
  const meso=mesoForDate(S.currentDate);
  const wd=meso?getMesoWD(meso,S.currentDate):null;
  if(wd){
    document.getElementById('wklbl').innerHTML=`WEEK ${wd.week}<span style="color:var(--txt3);font-size:13px"> / ${wd.totalWeeks}</span> <span>DAY ${wd.day}</span>${wd.isDeload?' <span style="font-size:11px;color:var(--amber)">DELOAD</span>':''}`;
    document.getElementById('hdrsub').textContent=`${meso.name} · ${fmtS(meso.startDate)}`;
  }else{
    document.getElementById('wklbl').innerHTML=`<span style="color:var(--txt2);font-weight:400;font-size:15px">No session scheduled</span>`;
    document.getElementById('hdrsub').textContent='';
  }
  document.getElementById('ddisplay').textContent=S.currentDate===tod()?'Today':fmtS(S.currentDate);
  renderTab();
}
function ST(tab,tabEl,navEl){
  S.activeTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const tabs=['workout','mesos','history','stats','settings'];
  document.querySelectorAll('.tab')[tabs.indexOf(tab)]?.classList.add('active');
  const nm={workout:'nw',mesos:'nm',history:'nh',stats:'ns',settings:'nset'};
  document.getElementById(nm[tab])?.classList.add('active');
  renderTab();
}
function renderTab(){
  const c=document.getElementById('mc');
  if(S.activeTab==='workout')renderWorkout(c);
  else if(S.activeTab==='mesos')renderMesos(c);
  else if(S.activeTab==='history')renderHistory(c);
  else if(S.activeTab==='stats')renderStats(c);
  else renderSettings(c);
}

function confirmDeleteDate(ds){
  showM(`<div class="mtt">Delete this date?<button class="mcb" onclick="closeM()">×</button></div>
    <div style="font-size:13px;font-weight:500;margin-bottom:6px">${fmtD(ds)}</div>

    <button class="mbtn rd" onclick="deleteDate('${ds}');closeM()">Yes, delete this date</button>
    <button class="mbtn gh" style="margin-top:6px" onclick="closeM()">Cancel</button>`);
}
function toggleNote(ei){const a=document.getElementById('na-'+ei);if(a)a.style.display=a.style.display==='none'?'block':'none';}
function updNote(ei,v){const w=getW(S.currentDate);if(w.exercises[ei])w.exercises[ei].note=v;save();}
function removeEx(ei){getW(S.currentDate).exercises.splice(ei,1);save();renderTab();}
function addSet(ei){const ex=getW(S.currentDate).exercises[ei];const l=ex.sets[ex.sets.length-1];ex.sets.push({weight:l?l.weight:'',reps:l?l.reps:'',logged:false});save();renderTab();}
function delSet(ei,si){const ex=getW(S.currentDate).exercises[ei];if(ex.sets.length<=1){alert('Need at least one set.');return;}ex.sets.splice(si,1);save();renderTab();}
function updSet(ei,si,f,v){getW(S.currentDate).exercises[ei].sets[si][f]=v;save();}
function togLog(ei,si){const s=getW(S.currentDate).exercises[ei].sets[si];s.logged=!s.logged;save();renderTab();}
function confirmClose(){
  const meso=mesoForDate(S.currentDate);
  const dates=meso?getMesoDates(meso):[];
  const isLast=dates.length&&S.currentDate===dates[dates.length-1];
  showM(`<div class="mtt">${isLast?'Complete mesocycle?':'Close this day?'}<button class="mcb" onclick="closeM()">×</button></div>
    <div style="font-size:13px;color:var(--txt2);margin-bottom:16px;line-height:1.6">${isLast?'This is the final day. Closing marks the mesocycle as <strong style="color:var(--amber)">complete</strong>.':'All sets locked. Next week pre-loaded with <strong style="color:var(--green)">+1 rep per set</strong> based on what you actually logged.'}</div>

    <button class="mbtn gh" style="margin-top:6px" onclick="closeM()">Cancel</button>`);
}
function openAddEx(){
  const lib=getLib();
  function bl(f){
    let h='';
    Object.entries(lib).forEach(([muscle,exs])=>{
      const fl=exs.filter(e=>e.toLowerCase().includes((f||'').toLowerCase()));
      if(!fl.length)return;
      h+=`<div class="stit">${muscle}</div>`;
      fl.forEach(ex=>{h+=`<div class="expick" onclick="addExW('${muscle}','${ex.replace(/'/g,"\\'")}')"><span style="color:var(--accent);font-size:16px">+</span>${ex}</div>`;});
    });
    return h||'<div style="color:var(--txt2);padding:12px;font-size:13px">No matches</div>';
  }
  window._wbl=bl;
  const muscles=Object.keys(lib);
  showM(`<div class="mtt">Add Exercise<button class="mcb" onclick="closeM()">×</button></div>
    <input class="mi" id="wes" placeholder="Search exercises..." oninput="document.getElementById('wel').innerHTML=window._wbl(this.value)">
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <input class="mi" id="wcn" placeholder="Or type new exercise..." style="flex:1;margin:0">
      <select class="mi" id="wcm" style="width:auto;margin:0;flex-shrink:0">${muscles.map(m=>`<option>${m}</option>`).join('')}</select>
      <button class="mbtn g" style="width:auto;padding:10px 12px;margin:0;flex-shrink:0;min-height:44px" onclick="addCustW()">Add</button>
    </div>
    <div id="wel" style="max-height:340px;overflow-y:auto;border-top:1px solid var(--border)">${bl('')}</div>`);
}
function addExW(muscle,name){getW(S.currentDate).exercises.push({muscle,name,note:'',sets:[{weight:'',reps:'',logged:false}]});save();closeM();renderTab();}
function addCustW(){
  const name=document.getElementById('wcn').value.trim();
  const muscle=document.getElementById('wcm').value;
  if(!name)return;
  if(!S.customExercises[muscle])S.customExercises[muscle]=[];
  if(!S.customExercises[muscle].includes(name))S.customExercises[muscle].push(name);
  save();addExW(muscle,name);
}
function renderMesos(c){
  const mesos=[...S.mesocycles].reverse();
  let h=`<button class="nmbtn" onclick="openNewMeso()">+ New Mesocycle</button>`;
  if(!mesos.length){h+=`<div style="text-align:center;padding:20px;color:var(--txt2);font-size:13px">No mesocycles yet.</div>`;c.innerHTML=h;return;}
  h+=mesos.map(m=>{
    const tw=m.weeks+(m.deload?1:0);
    const dates=getMesoDates(m);
    const cw=m.status==='done'?tw:Math.max(0,...dates.filter(d=>S.workouts[d]?.closed).map(d=>{const wd=getMesoWD(m,d);return wd?wd.week:0}).concat([0]));

      const w=i+1;const isD=m.deload&&w===tw;

      return`<div class="wd ${cls}">${isD?'D':w}</div>`;
    }).join('');
    const st=m.status==='active'?'active':'done';
    return`<div class="mcard${m.status==='active'?' am':''}" onclick="openMesoDetail('${m.id}')">
      <div style="display:flex;justify-content:space-between;align-items:start">

}

function createMeso(){

  const deload=document.getElementById('nmd')?.checked||false;
  const trainDays=[...document.querySelectorAll('#nmdys .dtt.on')].map(el=>parseInt(el.dataset.i)).sort();
  if(!trainDays.length){alert('Select at least one training day.');return;}
  const copyId=document.getElementById('nmcp')?.value||'';
  const src=S.mesocycles.find(m=>m.id===copyId);
  let days;
  if(src&&src.days){
    days=trainDays.map((_,i)=>{
      const s=src.days[i%src.days.length];
      return{label:`Day ${i+1}`,exercises:(s.exercises||[]).map(ex=>({muscle:ex.muscle,name:ex.name,note:'',sets:ex.sets.map(s=>({weight:'',reps:s.reps,logged:false}))}))};
    });
  }else{
    days=trainDays.map((_,i)=>({label:`Day ${i+1}`,exercises:[]}));
  }
  const id='M'+Date.now();
  S.mesocycles.forEach(m=>{if(m.status==='active')m.status='done';});

function copyDay(mesoId,fromIdx,toIdx){
  const meso=S.mesocycles.find(m=>m.id===mesoId);if(!meso)return;
  const src=meso.days[fromIdx];const dst=meso.days[toIdx];
  src.exercises.forEach(ex=>{if(!dst.exercises.find(e=>e.name===ex.name)){dst.exercises.push({muscle:ex.muscle,name:ex.name,note:'',sets:ex.sets.map(s=>({weight:s.weight,reps:s.reps,logged:false}))});}});
  save();openMesoConfig(mesoId,toIdx);
}
function addExDay(mesoId,dayIdx,muscle,name){
  const meso=S.mesocycles.find(m=>m.id===mesoId);if(!meso)return;
  const day=meso.days[dayIdx];
  if(day.exercises.find(e=>e.name===name))return;

function addCustDay(mesoId,dayIdx){

// ── FIX 2: CSV Export ────────────────────────────────────────
function exportCSV(){
  const rows=[['Date','Mesocycle ID','Mesocycle Name','Week','Day','Muscle Group','Exercise','Set #','Weight (kg)','Reps','Notes']];
  const dates=Object.keys(S.workouts).sort();
  for(const ds of dates){
    const w=S.workouts[ds];
    if(!(w.exercises||[]).length)continue;
    const meso=mesoForDate(ds);
    const wd=meso?getMesoWD(meso,ds):null;
    const mesoId=meso?meso.id:'';
    const mesoName=meso?meso.name:'';
    const week=wd?wd.week:'';
    const day=wd?wd.day:'';
    for(const ex of(w.exercises||[])){
      ex.sets.forEach((s,si)=>{
        rows.push([ds,mesoId,mesoName,week,day,ex.muscle,ex.name,si+1,s.weight||'',s.reps||'',ex.note||'']);
      });
    }
  }
  const csv=rows.map(r=>r.map(v=>{
    const str=String(v);
    return str.includes(',')||str.includes('"')||str.includes('\n')?`"${str.replace(/"/g,'""')}"`:str;
  }).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  const ts=new Date().toISOString().split('T')[0];
  a.download=`workout_history_${ts}.csv`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  const el=document.getElementById('exp-status');
  if(el){el.textContent=`✅ Exported ${rows.length-1} sets`;el.style.display='block';setTimeout(()=>el.style.display='none',4000);}
}

function copyExp(){
  const txt=JSON.stringify(S,null,2);
  const ok=()=>{const el=document.getElementById('cok');if(el){el.style.display='block';setTimeout(()=>el.style.display='none',3000);}};
  if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(ok).catch(()=>fbCopy(txt,ok));
  else fbCopy(txt,ok);
}
function fbCopy(txt,cb){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');cb&&cb();}catch(e){alert('Please manually select and copy the text above.');}
  document.body.removeChild(ta);
}
function doImport(){
  const raw=document.getElementById('ipaste').value.trim();
  if(!raw){alert('Paste your backup JSON first.');return;}
  try{
    const d=JSON.parse(raw);
    if(d.mesocycles)S.mesocycles=d.mesocycles;
    if(d.workouts)S.workouts=d.workouts;
    if(d.customExercises)S.customExercises=d.customExercises;
    save();renderAll();
    document.getElementById('ipaste').value='';
    alert('Import successful!');
  }catch(e){alert('Could not read that data.');}
}

// ── FIX 3: CSV Import (restored) ─────────────────────────────
let _csvParsed=null;
function handleCSV(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const result=parseWorkoutCSV(e.target.result);
    _csvParsed=result;
    const prev=document.getElementById('csv-preview');
    const btn=document.getElementById('csv-import-btn');
    if(result.error){
      prev.innerHTML=`<span style="color:var(--red)">⚠️ ${result.error}</span>`;
      btn.style.display='none';
    }else{
      prev.innerHTML=`<span style="color:var(--green)">✅ Ready to import:</span><br>
        • <strong style="color:var(--txt)">${result.totalSets}</strong> sets across <strong style="color:var(--txt)">${result.totalDays}</strong> days<br>
        • Mesocycles: <strong style="color:var(--txt)">${result.mesoList.join(', ')}</strong><br>
        • Date range: <strong style="color:var(--txt)">${result.dateRange}</strong>`;
      btn.style.display='block';
    }
  };
  reader.readAsText(file);
}
function parseWorkoutCSV(text){
  try{
    const lines=text.trim().split('\n');
    if(lines.length<2)return{error:'CSV file appears empty.'};
    const header=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    const idx={
      date:header.findIndex(h=>h.toLowerCase().includes('date')),
      meso:header.findIndex(h=>h.toLowerCase().includes('mesocycle id')),
      mesoName:header.findIndex(h=>h.toLowerCase().includes('mesocycle name')),
      week:header.findIndex(h=>h.toLowerCase().includes('week')),
      muscle:header.findIndex(h=>h.toLowerCase().includes('muscle')),
      exercise:header.findIndex(h=>h.toLowerCase().includes('exercise')),
      weight:header.findIndex(h=>h.toLowerCase().includes('weight')),
      reps:header.findIndex(h=>h.toLowerCase().includes('reps')),
      notes:header.findIndex(h=>h.toLowerCase().includes('notes')),
    };
    if(idx.date<0||idx.exercise<0||idx.weight<0||idx.reps<0)
      return{error:'Could not find required columns (Date, Exercise, Weight, Reps).'};
    const workouts={};const mesoMap={};const allDates=[];let totalSets=0;
    for(let i=1;i<lines.length;i++){
      const line=lines[i].trim();if(!line)continue;
      const cols=[];let cur='',inQ=false;
      for(let c=0;c<line.length;c++){
        if(line[c]==='"'){inQ=!inQ;}
        else if(line[c]===','&&!inQ){cols.push(cur.trim());cur='';}
        else cur+=line[c];
      }
      cols.push(cur.trim());
      const date=cols[idx.date]?.trim();
      const muscle=cols[idx.muscle]?.trim()||'Other';
      const exercise=cols[idx.exercise]?.trim();
      const weight=parseFloat(cols[idx.weight])||0;
      const reps=parseInt(cols[idx.reps])||0;
      const notes=idx.notes>=0?(cols[idx.notes]?.trim()||''):'';
      const mesoId=idx.meso>=0?(cols[idx.meso]?.trim()||''):'';
      const mesoName=idx.mesoName>=0?(cols[idx.mesoName]?.trim()||mesoId):mesoId;
      if(!date||!exercise)continue;
      if(mesoId&&mesoName)mesoMap[mesoId]=mesoName;
      if(!workouts[date]){workouts[date]={exercises:[],closed:true};allDates.push(date);}
      let exEntry=workouts[date].exercises.find(e=>e.name===exercise&&e.muscle===muscle);
      if(!exEntry){exEntry={muscle,name:exercise,note:notes,sets:[]};workouts[date].exercises.push(exEntry);}
      exEntry.sets.push({weight:weight||'',reps:reps||'',logged:true});
      totalSets++;
    }
    allDates.sort();
    return{workouts,mesoMap,totalSets,totalDays:allDates.length,mesoList:[...new Set(Object.values(mesoMap))],dateRange:allDates.length?`${allDates[0]} → ${allDates[allDates.length-1]}`:'n/a'};
  }catch(e){return{error:'Failed to parse CSV: '+e.message};}
}
function confirmCSVImport(){
  if(!_csvParsed||_csvParsed.error)return;
  const existing=Object.keys(S.workouts).length;
  const msg=existing>0
    ?`This will merge ${_csvParsed.totalSets} sets into your tracker (existing data is kept). Continue?`
    :`Import ${_csvParsed.totalSets} sets across ${_csvParsed.totalDays} days?`;
  if(!confirm(msg))return;
  for(const[date,w]of Object.entries(_csvParsed.workouts)){
    if(!S.workouts[date]){S.workouts[date]=w;}
    else{for(const ex of w.exercises){const e=S.workouts[date].exercises.find(e=>e.name===ex.name);if(!e)S.workouts[date].exercises.push(ex);}}
  }
  save();renderAll();
  document.getElementById('csv-preview').innerHTML=`<span style="color:var(--green)">✅ Import complete — ${_csvParsed.totalSets} sets loaded!</span>`;
  document.getElementById('csv-import-btn').style.display='none';
  document.getElementById('csvfile').value='';
  _csvParsed=null;
}
